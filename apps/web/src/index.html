<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Stéphane Lieumont — Lead Tech &amp; graphiste 3D</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/textures/motes.svg" as="image" type="image/svg+xml" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- The world's ground before the stylesheet arrives: a full navigation
         (the language switcher) must not flash the browser's white. Same
         values as --world-dev-ground / --world-cgi-ground. -->
    <style>
      html {
        background: #12100f;
      }
      html[data-world='cgi'] {
        background: #f2a154;
      }
    </style>

    <!-- Says the script is coming, before first paint. The reveal hides
         nothing without it (spec 07 §4.2); main.ts withdraws it if bootstrap
         fails. -->
    <script>
      // Arriving from the language switcher (ADR-0017) is the same page in the
      // other language: nothing enters again, as if script had not announced
      // itself, and the cloud stands assembled.
      var switched = false;
      try {
        switched = sessionStorage.getItem('lang-switch') !== null;
      } catch (e) {}
      document.documentElement.classList.add(switched ? 'lang-switched' : 'js-motion');
      // The client plates' dot field is a mask tile: until it has loaded, the
      // mask paints the whole tint (a flat block on a slow line). The field
      // waits for it (src/styles/_plate.scss).
      var tile = new Image();
      tile.onload = function () {
        document.documentElement.setAttribute('data-motes-tile', '');
      };
      tile.src = '/textures/motes.svg';

      // A plate learns its picture has come before the app does: on a slow
      // line the prerendered pictures land seconds ahead of the bundle
      // (src/styles/_plate.scss). Load and error do not bubble; the capture
      // phase sees every one, cached ones included. A picture that took no
      // time (a cache) arrives without a fade.
      var seer = null;
      function plateOf(img) {
        return img.tagName === 'IMG' ? img.closest('.plate') : null;
      }
      document.addEventListener(
        'load',
        function (event) {
          var img = event.target;
          var plate = plateOf(img);
          if (!plate || plate.hasAttribute('data-plate-loaded')) return;
          var entry = performance.getEntriesByName(img.currentSrc)[0];
          var slow = entry && entry.responseEnd - entry.startTime > 100;
          plate.setAttribute('data-plate-loaded', slow ? 'fade' : '');
          if (seer) seer.unobserve(plate);
        },
        true,
      );
      document.addEventListener(
        'error',
        function (event) {
          var img = event.target;
          var plate = plateOf(img);
          if (!plate) return;
          // A failed derivative is retried as the original; browsers never do it alone.
          if (img.hasAttribute('srcset')) {
            img.removeAttribute('srcset');
            img.removeAttribute('sizes');
            return;
          }
          plate.setAttribute('data-plate-failed', '');
          if (seer) seer.unobserve(plate);
        },
        true,
      );
      // Only a plate on screen says it is waiting; the band leans like the sweep.
      document.documentElement.style.setProperty(
        '--plate-skew',
        -Math.atan((0.2 * innerWidth) / innerHeight) + 'rad',
      );
      document.addEventListener('readystatechange', function () {
        if (document.readyState !== 'interactive' || !window.IntersectionObserver) return;
        seer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            entry.target.toggleAttribute('data-plate-seen', entry.isIntersecting);
          });
        });
        document.querySelectorAll('.plate').forEach(function (plate) {
          if (!plate.matches('[data-plate-loaded], [data-plate-failed]')) seer.observe(plate);
        });
      });
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
