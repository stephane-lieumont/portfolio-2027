<div class="wrap">
  <app-world-hero [page]="page()" />

  <section class="body">
    <app-point-cloud [world]="world()" />

    <div class="text">
      <p class="lede enter-line" style="--line: 2">
        <strong>{{ page().lede.lead | localized }}</strong> {{ page().lede.text | localized }}
      </p>
      <app-scrub-sentence [text]="page().scrub | localized" />
      <dl class="facts">
        @for (fact of page().facts; track $index) {
          <div class="facts__row enter-line" [style.--line]="3 + $index">
            <dt>{{ fact.label | localized }}</dt>
            <dd>{{ fact.value | localized }}</dd>
          </div>
        }
      </dl>
      <div class="ctas">
        <a class="btn" [routerLink]="contactPath" i18n="@@world.ctaContact">Me contacter</a>
        @if (cv) {
          <a class="btn btn--ghost" [href]="cv" target="_blank" rel="noopener"
            ><ng-container i18n="@@world.ctaCv">Mon CV</ng-container
            ><span class="visually-hidden" i18n="@@pdfNewTab"> (PDF, nouvel onglet)</span></a
          >
        }
      </div>
    </div>
  </section>

  @if (world() === 'dev') {
    <app-dev-work [lineStart]="workStart()" />
  } @else {
    <app-art-mosaic [lineStart]="workStart()" />
  }

  <app-world-stack [stack]="stack()" />
</div>
