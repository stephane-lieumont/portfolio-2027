<article class="page section not-found">
  <div class="not-found__layout">
    <header class="section__head reveal-lines" appReveal>
      <p class="t-overline section__eyebrow">Erreur 404</p>
      <h1 class="t-display not-found__code">404</h1>
      <!-- Nothing under the joke. The code says what happened, the picture says
           how it feels, and the links say what to do — an explanation of the
           URL migration is after-sales service on an error page. -->
      <p class="t-lead not-found__joke">Page not found — Where is the intercom&nbsp;?</p>
    </header>

    <!-- The easter egg, carried over from the 2022 site. It is the one place on
         the portfolio where the tone breaks, and that is exactly why it works —
         a 404 is the only page nobody chose to visit. Beside the joke rather
         than under it: they are one gag, and scrolling between them tells it
         twice. -->
    <img
      class="not-found__gif"
      src="/medias/travolta-confused.gif"
      alt="John Travolta cherchant son chemin, perplexe"
      width="490"
      height="476"
      loading="lazy"
      decoding="async"
    />
  </div>

  <nav class="section__block" aria-label="Sections du site">
    <h2 class="t-h3">Où aller</h2>
    <ul class="not-found__links" role="list">
      @for (item of items; track item.path) {
        <li>
          <a class="button button--secondary" [routerLink]="item.path">{{ item.label }}</a>
        </li>
      }
      <li><a class="button button--primary" routerLink="/">Accueil</a></li>
    </ul>
  </nav>
</article>
