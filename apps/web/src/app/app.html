<a class="skip-link" href="#contenu" i18n="@@shell.skipLink">Aller au contenu</a>

<app-motes />

<!-- The header of the approved « Bascule » mockup: the role on the left,
     Contact and the world switch on the right. The name lives in each page's
     hero; the CV in the dock. -->
<header class="top glass">
  <div class="top__inner">
    <p class="top__who" i18n="@@site.role">Lead Tech &amp; graphiste 3D</p>
    <nav class="top__end" aria-label="Navigation principale" i18n-aria-label="@@shell.nav">
      <a
        class="top__link"
        [routerLink]="nav.contact.path"
        [attr.aria-current]="current(nav.contact.path)"
        >{{ nav.contact.label }}</a
      >
      <!-- The same page in the other tree (ADR-0017): a full navigation, not
           a route, so a plain href. -->
      <a
        #languageLink
        class="top__link top__lang"
        [href]="language().href"
        [attr.hreflang]="language().locale"
        [attr.lang]="language().locale"
        [attr.aria-label]="language().name"
      >
        <!-- The flag of the language the link leads to (Stéphane, 2026-11-15);
             the accessible name says it in words. -->
        @if (language().locale === 'en') {
          <svg class="top__flag" viewBox="0 0 60 40" aria-hidden="true">
            <clipPath id="flag-uk"><rect width="60" height="40" rx="4" /></clipPath>
            <g clip-path="url(#flag-uk)">
              <rect width="60" height="40" fill="#012169" />
              <path d="M0 0l60 40M60 0L0 40" stroke="#fff" stroke-width="8" />
              <path d="M0 0l60 40M60 0L0 40" stroke="#c8102e" stroke-width="3" />
              <path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="12" />
              <path d="M30 0v40M0 20h60" stroke="#c8102e" stroke-width="7" />
            </g>
          </svg>
        } @else {
          <svg class="top__flag" viewBox="0 0 60 40" aria-hidden="true">
            <clipPath id="flag-fr"><rect width="60" height="40" rx="4" /></clipPath>
            <g clip-path="url(#flag-fr)">
              <rect width="20" height="40" fill="#0055a4" />
              <rect x="20" width="20" height="40" fill="#fff" />
              <rect x="40" width="20" height="40" fill="#ef4135" />
            </g>
          </svg>
        }
      </a>
      <!-- The world switch is navigation (ADR-0014): two links. The thumb
           behind them is painted from the document's world. -->
      <ul class="switch" role="list">
        <li>
          <a
            class="switch__link switch__link--dev"
            [routerLink]="nav.dev.path"
            [attr.aria-current]="current(nav.dev.path)"
            >{{ nav.dev.label }}</a
          >
        </li>
        <li>
          <a
            class="switch__link switch__link--cgi"
            [routerLink]="nav.cgi.path"
            [attr.aria-current]="current(nav.cgi.path)"
            >{{ nav.cgi.label }}</a
          >
        </li>
      </ul>
    </nav>
  </div>
</header>

<main #main id="contenu" tabindex="-1">
  <router-outlet />
</main>

@if (showDock()) {
  <app-social-dock />
}

<footer class="copyright">© {{ year }} Stéphane Lieumont</footer>

<app-thread />

<p class="visually-hidden" aria-live="polite" aria-atomic="true">{{ announcement() }}</p>
