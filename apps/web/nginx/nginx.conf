# The site container (ADR-0005, ADR-0021, ADR-0023): the two prerendered trees,
# French at the root and English under /en/. It sits behind the VPS's reverse
# proxy, which terminates TLS, sets HSTS and routes /api and /medias before a
# request ever reaches this server.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Behind the proxy, this server sees http on 8080: an absolute Location
    # would send the visitor there. A relative one keeps the proxy's origin.
    absolute_redirect off;

    # No brotli: the official images ship without the module.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml image/svg+xml;

    # Defines $csp_inline_scripts, generated by the build from the pages.
    include /etc/nginx/csp-inline-scripts.conf;

    # Only / negotiates the language (ADR-0017): the switcher's cookie first,
    # then the browser's first language. Every other address opens the
    # language it names.
    map $cookie_lang $site_home_from_cookie {
        en      /en/developer;
        fr      /developpeur;
        default "";
    }
    map $http_accept_language $site_home_from_browser {
        ""          /developpeur;
        ~^\s*\*     /developpeur;
        ~*^\s*fr    /developpeur;
        default     /en/developer;
    }
    map $site_home_from_cookie $site_home {
        ""      $site_home_from_browser;
        default $site_home_from_cookie;
    }

    # Keyed on the URI being answered, after try_files or error_page: a page
    # is /contact/index.html here, the 404 page /404/index.html.
    map $uri $site_cache_control {
        /                               "no-store";
        /en                             "no-store";
        /en/                            "no-store";
        /healthz                        "no-store";
        "~-[A-Za-z0-9_-]{8}\.(?:js|css)$" "public, max-age=31536000, immutable";
        ~\.html$                        "no-cache";
        ~^/(?:robots\.txt|sitemap\.xml)$ "public, max-age=3600";
        default                         "public, max-age=86400";
    }
    map $uri $site_vary {
        /       "Accept-Language, Cookie";
        default "";
    }

    server {
        listen 8080;
        server_name _;
        root /srv/site;
        port_in_redirect off;

        # Set once here: a location with an add_header of its own would drop
        # them all, so none has one.
        add_header Cache-Control $site_cache_control always;
        add_header Vary $site_vary always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_inline_scripts https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            return 302 $site_home;
        }
        location = /en {
            return 302 /en/developer;
        }
        location = /en/ {
            return 302 /en/developer;
        }

        # A directory without a page (/fonts/) would answer 403: it is a miss.
        location /en/ {
            try_files $uri $uri/index.html =404;
            error_page 403 404 =404 /en/404/index.html;
        }
        location / {
            try_files $uri $uri/index.html =404;
            error_page 403 404 =404 /404/index.html;
        }
    }
}
